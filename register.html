<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell It - Registro</title>
    <link rel="stylesheet" href="./css/stylesheets.css">
</head>
<body>
    <header>
        <a href="./index.html"><img src="./img/logo de sell it.png" alt="Logo" class="logo"></a>
        <span class="sellit"><b>Sell It</b></span>
        <nav class="headernav">
            <ul>
               <li><a href="./index.html">Home</a></li>
                 <li><a href="./register.html">Registro</a></li>
                <li><a href="./login.html">Log in</a></li>
                </ul>
        </nav>
        <form action="./search.html" method="get">
            <input type="text" name="search" placeholder="Buscar...">
            <button type="submit">Buscar</button>
        </form>
    </header>
    <main>
        <div class="formulario">
            <h1>Crea una cuenta</h1>
            <form action="./login.html" method="get">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu email" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            <label for="confirm-password">Confirmar Contraseña:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu contraseña" required>
            <button type="submit">Registrarme</button>
            <a href="./login.html">Ya tengo una cuenta</a>
            </form>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
