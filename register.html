<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell It - Registro</title>
    <link rel="stylesheet" href="./css/stylesheets.css">
</head>
<body>
    <header>
        <a href="./index.html"><img src="./img/logo_de_sell_it.png" alt="Logo" class="logo"></a>
        <span class="sellit"><b>Sell It</b></span>
        <nav class="headernav">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./register.html">Registro</a></li>
                <li><a href="./login.html">Log in</a></li>
            </ul>
        </nav>
        <form class="formsearch" action="./search.html" method="get">
            <input type="text" name="search" value=" " placeholder="Buscar...">
            <button type="submit">Buscar</button>
        </form>
    </header>
    <main class="register">
        <div class="formulario-register">
            <form class="form-register" action="./login.html" method="get">
                <h1>Crea una cuenta</h1>
            <div class="input">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu email" value="" required>
            </div>

            <div class="input">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" value="" required>
            </div>

            <div class="input">
                <label for="confirm-password">Confirmar:</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu contraseña" value="" required>
            </div>

             <div class="input">
                <label for="terminos"> Acepto terminos y condiciones</label>
                <input type="checkbox" id="terminos" name="terminos" value="Aceptar">

            </div>
            <div>
                <button type="submit">Registrarme</button>
                <a href="./login.html">Ya tengo una cuenta</a>
            </div>
            </form>
            
        </div>
    </main>
    <footer>
        <ul>
            <li>Bautista Moro</li>
            <li>Nahuel Casco</li>
            <li>Pedro Reigosa</li>
        </ul>
    </footer>
</body>
</html>
