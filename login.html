<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell It - Login</title>
    <link rel="stylesheet" href="./css/stylesheets.css">
</head>
<body>
  <header>
        <a href="./index.html"><img src="./img/logo_de_sell_it.png" alt="Logo" class="logo"></a>
        <span class="sellit"><b>Sell It</b></span>
        <nav class="headernav">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./register.html">Registro</a></li>
                <li><a href="./login.html">Log in</a></li>
            </ul>
        </nav>
        <form class="formsearch" action="./search.html" method="get">
            <input type="text" name="search" placeholder="Buscar...">
            <button type="submit">Buscar</button>
        </form>
    </header>
    <main class="login">
        <div class="formulario-login">
            <h2>Iniciar Sesión</h2>
            <form action="index.html" method="GET" class="formulario">
                <div class="input">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Mail" required>
                </div>
                <div class="input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>
                <div class="bottonx"> 
                    <button type="submit" class="boton-login">ingresar</button>
                </div>
            </form>
            <p class="no-cuenta"><a href="register.html">No tengo cuenta</a></p>
        </div>
    </main>

    <footer>
        <p>Bautista Moro</p>
        <p>Nahuel Casco</p>
        <p>Pedro Reigosa</p>
    </footer>

</body>
</html>
